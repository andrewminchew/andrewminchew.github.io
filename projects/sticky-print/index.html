<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StickyPrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aladin&family=Barrio&family=Bytesized&family=Cherry+Bomb+One&family=Cinzel&family=Fontdiner+Swanky&family=Gravitas+One&family=Jim+Nightshade&family=Lobster&family=Monoton&family=New+Rocker&family=Orbitron&family=Pinyon+Script&family=Roboto&family=Rock+3D&family=Rock+Salt&family=Sue+Ellen+Francisco&display=swap">
<style>
  :root {
    --fw: 288px;
    --desk: #dfe4e8;
    --ink: #1d2a33;
    --ink-soft: #55646f;
    --line: #b9c3cb;
    --paper: #ffffff;
    --accent: #1f6f78;
    --accent-ink: #ffffff;
    --note: #f3d64e;
    --danger: #a3341f;
    --font: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #1c2328;
      --ink: #e8edf0;
      --ink-soft: #9aa9b4;
      --line: #3a4750;
      --accent: #5bb7c0;
      --accent-ink: #0d1a1d;
      --danger: #ff8d76;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    background: var(--desk);
    color: var(--ink);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  header.top h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    border: 2px solid var(--ink); background: transparent; border-radius: 6px;
    padding: 9px 14px; font-weight: 600; min-height: 44px;
  }
  .btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn[disabled] { opacity: .45; cursor: default; }

  .layout { display: grid; grid-template-columns: 1fr 364px; gap: 24px; padding: 20px; align-items: start; }
  .stage { display: flex; justify-content: center; min-width: 0; }
  .sheet-wrap { position: relative; }
  .sheet {
    position: absolute; top: 0; left: 0; width: 8.5in; height: 11in;
    background: var(--paper); color: #000; transform-origin: top left;
    box-shadow: 0 2px 4px rgba(0,0,0,.15), 0 12px 30px rgba(0,0,0,.18);
  }

  /* Sticky note slots on the sheet */
  .note {
    position: absolute; width: 3in; height: 3in; overflow: hidden;
    border: 2px solid #111; background: #fff; padding: 0;
  }
  .note .photo { position: absolute; max-width: none; display: none; user-select: none; -webkit-user-drag: none; }
  .note.is-photo .photo { display: block; }
  .note .label {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; font-size: 14px; pointer-events: none; text-align: center;
  }
  .note .label .adhesive { font-style: italic; font-size: 13px; position: absolute; top: 14px; }
  .note .label .slotname { font-weight: 800; font-size: 16px; }
  .note .label .hint { font-size: 13px; color: #555; }
  .note.filled .label { display: none; }
  .text, .tframe .text {
    position: absolute; left: 10px; top: 10px; width: 264px; height: 264px; margin: 0; display: none; align-content: start;
    font: 14pt/1.2 "Times New Roman", Times, serif; white-space: pre; color: #000; pointer-events: none; text-align: left;
  }
  .note.is-text .text { display: grid; }
  .tframe { position: relative; width: var(--fw); height: var(--fw); margin: 0 auto 14px; overflow: hidden; background: #fff; border: 2px solid var(--ink); }
  .tframe .text { display: grid; }
  .alignrow { display: flex; gap: 8px; margin: 10px 0; }
  .alignrow button { flex: 1; border: 2px solid var(--ink); background: transparent; border-radius: 6px; padding: 9px 4px; min-height: 44px; font-weight: 600; }
  .alignrow button.on { background: var(--ink); color: var(--desk); }
  .seg { display: flex; margin-bottom: 14px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 9px; font-weight: 600; min-height: 44px; }
  .seg button.on { background: var(--ink); color: var(--desk); }
  textarea#ttext {
    width: 100%; min-height: 120px; resize: vertical; font: 1rem/1.4 "Times New Roman", Times, serif;
    padding: 10px; border: 2px solid var(--ink); border-radius: 6px; background: transparent; color: inherit;
  }
  .tip.warn { color: var(--danger); }
  .fontrow { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .fontrow label { font-weight: 600; min-width: 48px; }
  .fontrow .btn { flex: 1; text-align: left; font-size: 1.05rem; }
  .fontlist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .fontopt { text-align: left; border: 2px solid var(--line); border-radius: 8px; background: transparent; padding: 10px 12px; width: 100%; }
  .fontopt:hover { border-color: var(--ink); }
  .fontopt.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .fontopt .fname { display: block; font: 600 .75rem var(--font); color: var(--ink-soft); margin-bottom: 4px; }
  .fontopt .fsample {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden;
    font-size: 14pt; line-height: 1.2; white-space: pre-wrap; overflow-wrap: anywhere; color: inherit;
  }
  @media (min-width: 861px) { .panel { max-height: calc(100vh - 32px); overflow-y: auto; } }
  .note.selected { box-shadow: 0 0 0 4px var(--note); z-index: 2; cursor: pointer; }
  .sheet .note { cursor: pointer; }
  .infobar {
    position: absolute; background: #c0c0c0; display: flex; align-items: center; justify-content: center;
  }
  .infobar span {
    writing-mode: vertical-rl; font-size: 11px; color: #333; white-space: nowrap;
  }

  /* Side panel */
  .panel {
    background: var(--paper); color: #111; border-radius: 10px; padding: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    position: sticky; top: 16px;
  }
  @media (prefers-color-scheme: dark) { .panel { background: #263037; color: var(--ink); } }
  .panel h2 { margin: 0 0 12px; font-size: 1rem; }
  .editor-empty { color: var(--ink-soft); font-size: .95rem; line-height: 1.5; }
  .crop {
    position: relative; width: var(--fw); height: var(--fw); margin: 0 auto 14px; overflow: hidden;
    background: #e9edf0; border: 2px solid var(--ink); touch-action: none; cursor: grab;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .crop.dragging { cursor: grabbing; }
  .note .content { position: absolute; inset: 0; }
  .stickywrap { position: relative; width: calc(var(--fw) + 32px); margin: 0 auto 6px; padding: 16px; }
  .stickywrap .crop, .stickywrap .tframe { margin: 0; }
  .edge { position: absolute; border: 0; padding: 0; border-radius: 4px; background: var(--line); opacity: .55; cursor: pointer; }
  .edge:hover { opacity: 1; }
  .edge::after { content: ''; position: absolute; }
  .edge.top, .edge.bottom { left: 16px; right: 16px; height: 12px; }
  .edge.left, .edge.right { top: 16px; bottom: 16px; width: 12px; }
  .edge.top { top: 1px; } .edge.bottom { bottom: 1px; } .edge.left { left: 1px; } .edge.right { right: 1px; }
  .edge.top::after, .edge.bottom::after { inset: -8px 0; }
  .edge.left::after, .edge.right::after { inset: 0 -8px; }
  .edge.on { opacity: 1; background: repeating-linear-gradient(45deg, var(--note) 0 6px, #c9a920 6px 9px); box-shadow: 0 0 0 1px #8a7410; }
  .stickycap { text-align: center; margin: 0 0 12px; }
  .crop img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .crop .empty-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; color: #55646f; padding: 20px; font-size: .95rem;
  }
  .row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .row label { font-weight: 600; min-width: 48px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); min-height: 32px; }
  .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .stack .pair { display: flex; gap: 8px; }
  .stack .pair .btn { flex: 1; }
  .tip { font-size: .85rem; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.45; }

  /* Mobile slot list (hidden on desktop) */
  .slotlist { display: none; }
  .mobile-only { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--desk);
    padding: 10px 16px; border-radius: 8px; font-size: .9rem; max-width: 90vw; z-index: 100; display: none;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 860px) {
    .layout { display: block; padding: 14px; }
    .stage { display: none; }
    header.top .desktop-actions { display: none; }
    .mobile-only { display: block; }
    .slotlist { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .slotrow {
      display: flex; align-items: center; gap: 12px; background: var(--paper); color: #111;
      border: 2px solid var(--ink); border-radius: 8px; padding: 8px 12px; min-height: 64px; width: 100%; text-align: left;
    }
    @media (prefers-color-scheme: dark) { .slotrow { background: #263037; color: var(--ink); } }
    .slotrow .name { font-weight: 700; flex: 1; }
    .slotrow .state { color: var(--ink-soft); font-size: .9rem; }
    .slotrow .thumb { width: 44px; height: 44px; border: 1.5px solid var(--line); background: #e9edf0 center/cover no-repeat; }
    .mobile-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

    /* editor becomes full-screen overlay */
    .panel {
      display: none; position: fixed; inset: 0; z-index: 40; border-radius: 0; overflow-y: auto;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px));
    }
    body.editing .panel { display: block; }
    :root { --fw: min(288px, calc(100vw - 68px)); }

    /* review overlay */
    body.reviewing .stage {
      display: flex; position: fixed; inset: 0; z-index: 30; background: var(--desk); overflow: auto;
      padding: calc(64px + env(safe-area-inset-top, 0px)) 12px calc(84px + env(safe-area-inset-bottom, 0px));
    }
    .reviewbar {
      display: none; position: fixed; left: 0; right: 0; z-index: 35; gap: 10px; padding: 10px 14px; background: var(--desk);
    }
    body.reviewing .reviewbar { display: flex; }
    .reviewbar.t { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); justify-content: space-between; align-items: center; }
    .reviewbar.b { bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    .reviewbar.b .btn { flex: 1; }
  }
  .reviewbar { display: none; }
  .file-input { display: none; }
  body.editing, body.reviewing { overscroll-behavior: none; }
  .dlg-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 90; display: none; align-items: center; justify-content: center; padding: 20px; }
  .dlg-back.open { display: flex; }
  .dlg { background: var(--paper); color: #111; border-radius: 10px; padding: 20px; max-width: 360px; width: 100%; }
  @media (prefers-color-scheme: dark) { .dlg { background: #263037; color: var(--ink); } }
  .dlg h2 { margin: 0 0 8px; font-size: 1.05rem; }
  .dlg p { margin: 0 0 14px; line-height: 1.45; font-size: .95rem; }
  .dlg .stack { margin-top: 0; }
  .dlg a.btn { text-decoration: none; text-align: center; display: block; }

  /* ---------- Print ---------- */
  @page { size: letter; margin: 0; }
  @media print {
    html, body { background: #fff !important; min-height: 0; padding: 0 !important; }
    header.top, .panel, .slotlist, .mobile-actions, .reviewbar, .toast, .mobile-only { display: none !important; }
    .layout { display: block !important; padding: 0 !important; margin: 0 !important; }
    .stage { display: block !important; position: static !important; padding: 0 !important; overflow: visible !important; background: none !important; }
    .sheet-wrap { width: 8.5in !important; height: 11in !important; }
    .sheet { box-shadow: none !important; transform: none !important; }
    .note.selected { box-shadow: none !important; }
    .note .label .hint { display: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* Sheet print: photos only, no outlines/labels/info bar */
    body.print-sheet .note { border-color: transparent !important; background: transparent !important; }
    body.print-sheet .note .label, body.print-sheet .infobar { display: none !important; }

    /* Template print: outlines and labels only, no photos */
    body.print-template .note .photo, body.print-template .note .text { display: none !important; }
    body.print-template .note .label { display: flex !important; }
    body.print-template .note { background: #fff !important; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>StickyPrint v1.9</h1>
  <div class="actions desktop-actions">
    <button class="btn" id="btnTemplate">Print template</button>
    <button class="btn primary" id="btnPrint">Print sheet</button>
  </div>
</header>

<main class="layout">
  <section class="stage" id="stage">
    <div class="sheet-wrap" id="sheetWrap">
      <div class="sheet" id="sheet"></div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Slot editor">
    <h2 id="panelTitle">Select a slot</h2>
    <div id="panelBody"></div>
  </aside>

  <!-- Mobile home -->
  <section class="mobile-only" id="mobileHome">
    <button class="btn" id="mBtnTemplate" style="width:100%">Print template</button>
    <div class="slotlist" id="slotList"></div>
    <div class="mobile-actions">
      <button class="btn primary" id="mBtnReview">Review and print</button>
    </div>
  </section>
</main>

<div class="reviewbar t"><strong>Review</strong><button class="btn" id="rvBack">Back</button></div>
<div class="reviewbar b"><button class="btn primary" id="rvPrint">Print sheet</button></div>

<input type="file" accept="image/*" class="file-input" id="fileInput">
<div class="dlg-back" id="dlgBack">
  <div class="dlg" role="dialog" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle">Your PDF is ready</h2>
    <img id="dlgPreview" alt="Preview of the page" style="display:block;margin:0 auto 12px;width:220px;max-width:100%;border:1px solid var(--line);background:#fff">
    <p>Phone browsers add a URL, date, and page number to printed web pages. A PDF prints cleanly: open it, then choose Print from the PDF viewer or share sheet.</p>
    <pre id="dlgDebug" style="font-size:11px;white-space:pre-wrap;margin:0 0 12px;color:var(--ink-soft)"></pre>
    <div class="stack">
      <a class="btn primary" id="dlgOpen" target="_blank" rel="noopener">Open PDF</a>
      <button class="btn" id="dlgShare">Share or print…</button>
      <button class="btn" id="dlgClose">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  // ---------- Config (extend here for other page / note sizes later) ----------
  const PAGE = { w: 8.5, h: 11 };            // inches (Letter)
  const NOTE = 3;                             // inches (3 x 3 sticky note)
  const COLS = 2, ROWS = 3, GAP = 0.25;       // inches
  const BAR_W = 0.5, BAR_MARGIN = 0.5;        // gray info bar
  const LEFT = 0.5;
  const STORE_KEY = 'stickyprint.v1';
  const MAX_DIM = 1200;                       // downscale uploads to keep local storage small
  const MAX_ZOOM = 4;
  const PX = 96;                              // CSS px per inch

  // Slot model: { type:'image', src, scale, ox, oy, frame:null, filter:null }
  // ox/oy are pan offsets as a fraction of the note size, so they hold at any display size.
  // Future: type:'text' with text/font/size/align fields.
  let slots = Array(COLS * ROWS).fill(null);
  let selected = null;

  const $ = id => document.getElementById(id);
  const sheet = $('sheet'), wrap = $('sheetWrap'), stage = $('stage');
  const fileInput = $('fileInput'), toastEl = $('toast');

  // ---------- Storage ----------
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (data && Array.isArray(data.slots)) slots = data.slots.slice(0, 6).concat(Array(6).fill(null)).slice(0, 6);
      if (typeof data.textFont === 'string') textFont = fontOf(data.textFont);
      if (typeof data.textSize === 'number' && data.textSize >= 1) textSize = data.textSize;
      if (['left', 'center', 'right'].includes(data.textAlign)) textAlign = data.textAlign;
      if (['top', 'middle', 'bottom'].includes(data.textValign)) textValign = data.textValign;
      if (['top', 'right', 'bottom', 'left'].includes(data.stickyEdge)) stickyEdge = data.stickyEdge;
      // repair any slot saved with broken numbers
      slots.forEach(sl => {
        if (!sl || sl.type === 'text') return;
        sl.scale = (typeof sl.scale === 'number' && isFinite(sl.scale) && sl.scale >= 1) ? sl.scale : 1;
        sl.ox = (typeof sl.ox === 'number' && isFinite(sl.ox)) ? sl.ox : 0;
        sl.oy = (typeof sl.oy === 'number' && isFinite(sl.oy)) ? sl.oy : 0;
      });
    } catch (e) { /* start fresh */ }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ slots, textFont, textSize, textAlign, textValign, stickyEdge })); }
    catch (e) { toast('Browser storage is full. Clear a slot, or use a smaller photo.'); }
  }
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.display = 'none', 4000);
  }

  // ---------- Layout ----------
  const gridH = ROWS * NOTE + (ROWS - 1) * GAP;
  const TOP = (PAGE.h - gridH) / 2;
  const noteEls = [];
  function slotPos(i) {
    const c = i % COLS, r = Math.floor(i / COLS);
    return { x: LEFT + c * (NOTE + GAP), y: TOP + r * (NOTE + GAP) };
  }
  function buildSheet() {
    sheet.innerHTML = '';
    for (let i = 0; i < COLS * ROWS; i++) {
      const p = slotPos(i);
      const el = document.createElement('div');
      el.className = 'note'; el.tabIndex = 0; el.setAttribute('role', 'button');
      el.setAttribute('aria-label', 'Edit slot ' + (i + 1));
      el.style.left = p.x + 'in'; el.style.top = p.y + 'in';
      el.innerHTML =
        '<div class="content"><img class="photo" alt="" draggable="false"><div class="text"></div></div>' +
        '<div class="label"><span class="adhesive">Adhesive here</span>' +
        '<span class="slotname">Slot ' + (i + 1) + '</span>' +
        '<span class="hint">Click to add a photo or text</span></div>';
      el.addEventListener('click', () => openSlot(i));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSlot(i); } });
      sheet.appendChild(el); noteEls.push(el);
    }
    const bar = document.createElement('div');
    bar.className = 'infobar';
    bar.style.left = (PAGE.w - BAR_MARGIN - BAR_W) + 'in';
    bar.style.top = TOP + 'in'; bar.style.width = BAR_W + 'in'; bar.style.height = gridH + 'in';
    bar.innerHTML = '<span>StickyPrint: print this template, stick notes in the boxes, feed the sheet back in the same way, then print your photos.</span>';
    sheet.appendChild(bar);
  }

  function fitSheet() {
    const availW = stage.clientWidth || (window.innerWidth - 24);
    const isMobile = window.matchMedia('(max-width: 860px)').matches;
    const availH = isMobile ? Infinity : window.innerHeight - 110;
    const s = Math.min(1, availW / (PAGE.w * PX), availH / (PAGE.h * PX));
    wrap.style.width = PAGE.w * PX * s + 'px';
    wrap.style.height = PAGE.h * PX * s + 'px';
    sheet.style.transform = 'scale(' + s + ')';
  }

  // ---------- Image placement ----------
  // Positions an <img> inside a square container so it covers it, honoring scale and pan.
  function placeImage(img, S, slot) {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h || !(S > 0)) return;   // hidden elements report size 0; bail out so we never write NaN into the slot
    const base = Math.max(S / w, S / h);
    const dw = w * base * slot.scale, dh = h * base * slot.scale;
    const maxX = (dw - S) / 2, maxY = (dh - S) / 2;
    slot.ox = clamp(slot.ox, -maxX / S, maxX / S);
    slot.oy = clamp(slot.oy, -maxY / S, maxY / S);
    img.style.width = dw + 'px'; img.style.height = dh + 'px';
    img.style.left = ((S - dw) / 2 + slot.ox * S) + 'px';
    img.style.top = ((S - dh) / 2 + slot.oy * S) + 'px';
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // ---------- Fonts ----------
  const TEXT_PT = 14, TEXT_PAD_IN = 0.125, TEXT_LEAD = 1.2;
  const TEXT_FONT_PX = TEXT_PT * PX / 72;
  const FONTS = [
    { id: 'times', name: 'Times New Roman', css: '"Times New Roman", Times, serif', system: true },
    { id: 'aladin', name: 'Aladin', family: 'Aladin', fb: 'cursive' },
    { id: 'barrio', name: 'Barrio', family: 'Barrio', fb: 'cursive' },
    { id: 'bytesized', name: 'Bytesized', family: 'Bytesized', fb: 'sans-serif' },
    { id: 'cherrybomb', name: 'Cherry Bomb One', family: 'Cherry Bomb One', fb: 'cursive' },
    { id: 'cinzel', name: 'Cinzel', family: 'Cinzel', fb: 'serif' },
    { id: 'fontdiner', name: 'Fontdiner Swanky', family: 'Fontdiner Swanky', fb: 'cursive' },
    { id: 'gravitas', name: 'Gravitas One', family: 'Gravitas One', fb: 'serif' },
    { id: 'jimnightshade', name: 'Jim Nightshade', family: 'Jim Nightshade', fb: 'cursive' },
    { id: 'lobster', name: 'Lobster', family: 'Lobster', fb: 'cursive' },

        ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(2 * k, DPI < 150 ? 6 : 0); // thicker in the small preview so it stays visible
        ctx.strokeRect(x + k, y + k, full - 2 * k, full - 2 * k);
        ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'italic ' + 13 * k + 'px ' + 'Helvetica, Arial, sans-serif';
        ctx.fillText('Adhesive here', x + full / 2, y + 14 * k + 8 * k);
        ctx.font = 'bold ' + 16 * k + 'px Helvetica, Arial, sans-serif';
        ctx.fillText('Slot ' + (i + 1), x + full / 2, y + full / 2);
      } else if (slots[i] && slots[i].type === 'text') {
        const fid = fontOf(slots[i].font);
        await ensureFont(fid);
        ctx.save(); ctx.beginPath(); ctx.rect(x, y, full, full); ctx.clip();
        ctx.translate(x + full / 2, y + full / 2); ctx.rotate(rotDeg(slots[i]) * Math.PI / 180); ctx.translate(-(x + full / 2), -(y + full / 2));
        const pt = sizeOf({ text: slots[i].text, font: fid, size: slots[i].size });
        drawLines(ctx, wrapText(slots[i].text, fid, pt), fid, DPI / PX, x, y, pt, alignOf(slots[i]), valignOf(slots[i]));
        ctx.restore();
      } else if (slots[i]) {
        const slot0 = slots[i], im = await loadImg(slot0.src);
        const slot = { scale: Math.max(1, isFinite(slot0.scale) ? slot0.scale : 1), ox: isFinite(slot0.ox) ? slot0.ox : 0, oy: isFinite(slot0.oy) ? slot0.oy : 0 };
        const S = (NOTE - 2 * inset) * DPI, ix = x + inset * DPI, iy = y + inset * DPI;
        const base = Math.max(S / im.naturalWidth, S / im.naturalHeight);
        const dw = im.naturalWidth * base * slot.scale, dh = im.naturalHeight * base * slot.scale;
        ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, S, S); ctx.clip();
        ctx.translate(x + full / 2, y + full / 2); ctx.rotate(rotDeg(slots[i]) * Math.PI / 180); ctx.translate(-(x + full / 2), -(y + full / 2));
        ctx.drawImage(im, ix + (S - dw) / 2 + slot.ox * S, iy + (S - dh) / 2 + slot.oy * S, dw, dh);
        ctx.restore();
      }
    }
    if (mode === 'template') {
      const bx = (PAGE.w - BAR_MARGIN - BAR_W) * DPI, by = TOP * DPI;
      ctx.fillStyle = '#c0c0c0'; ctx.fillRect(bx, by, BAR_W * DPI, gridH * DPI);
      ctx.save(); ctx.translate(bx + BAR_W * DPI / 2, by + gridH * DPI / 2); ctx.rotate(Math.PI / 2);
      ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 11 * k + 'px Helvetica, Arial, sans-serif';
      ctx.fillText('StickyPrint: print this template, stick notes in the boxes, feed the sheet back in the same way, then print your photos.', 0, 0);
      ctx.restore();
    }
    return c;
  }

  // Vector PDF: outlines, text and original photo bytes, no big canvas (iOS can silently blank large canvases)
  let lastDebug = '';
  // Convert text to WinAnsi bytes (as a binary string) and escape for a PDF string literal
  const WIN = { '\u20AC': 0x80, '\u2026': 0x85, '\u2018': 0x91, '\u2019': 0x92, '\u201C': 0x93, '\u201D': 0x94, '\u2022': 0x95, '\u2013': 0x96, '\u2014': 0x97, '\u2122': 0x99 };
  function pdfText(str) {
    let out = '';
    for (const ch of str) {
      const cp = ch.codePointAt(0);
      let b = WIN[ch] !== undefined ? WIN[ch] : (cp >= 32 && cp < 127) || (cp >= 160 && cp < 256) ? cp : 63;
      const t = String.fromCharCode(b);
      out += (t === '(' || t === ')' || t === '\\') ? '\\' + t : t;
    }
    return out;
  }
  function dataUrlBytes(src) {
    const bin = atob(src.slice(src.indexOf(',') + 1)), b = new Uint8Array(bin.length);
    for (let j = 0; j < bin.length; j++) b[j] = bin.charCodeAt(j);
    return b;
  }
  function jpegInfo(b) {
    if (b[0] !== 0xFF || b[1] !== 0xD8) return null;
    let i = 2;
    while (i + 9 < b.length) {
      if (b[i] !== 0xFF) { i++; continue; }
      const m = b[i + 1];
      if (m === 0xFF) { i++; continue; }
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8], n: b[i + 9] };
      i += 2 + ((b[i + 2] << 8) | b[i + 3]);
    }
    return null;
  }
  async function buildPdf(mode) {
    const PW = PAGE.w * 72, PH = PAGE.h * 72, f2 = v => v.toFixed(2);
    const inset = 2 / PX;
    const measure = (txt, font, size) => {
      try { const x = document.createElement('canvas').getContext('2d'); x.font = font + ' 100px Helvetica, Arial, sans-serif'; return x.measureText(txt).width * size / 100; }
      catch (e) { return txt.length * size * 0.5; }
    };
    const imgs = [], debug = []; let c = '';
    if (mode === 'template') {
      const lw = 1.5;
      for (let i = 0; i < slots.length; i++) {
        const p = slotPos(i), cx = (p.x + NOTE / 2) * 72, top = PH - p.y * 72;
        c += '0 G ' + lw + ' w ' + f2(p.x * 72 + lw / 2) + ' ' + f2(PH - (p.y + NOTE) * 72 + lw / 2) + ' ' + f2(NOTE * 72 - lw) + ' ' + f2(NOTE * 72 - lw) + ' re S\n';
        const t1 = 'Adhesive here', t2 = 'Slot ' + (i + 1);
        c += '0 g BT /F2 9.75 Tf ' + f2(cx - measure(t1, 'italic', 9.75) / 2) + ' ' + f2(top - 22) + ' Td (' + t1 + ') Tj ET\n';
        c += '0 g BT /F3 12 Tf ' + f2(cx - measure(t2, 'bold', 12) / 2) + ' ' + f2(top - NOTE * 36 - 4) + ' Td (' + t2 + ') Tj ET\n';
      }
      const bx = (PAGE.w - BAR_MARGIN - BAR_W) * 72, bw = BAR_W * 72, bh = gridH * 72, by = PH - (TOP + gridH) * 72;
      c += '0.753 g ' + f2(bx) + ' ' + f2(by) + ' ' + f2(bw) + ' ' + f2(bh) + ' re f\n';
      const msg = 'StickyPrint: print this template, stick notes in the boxes, feed the sheet back in the same way, then print your photos.';
      const sz = 8.25, w = measure(msg, '', sz);
      c += '0.2 g BT /F1 ' + sz + ' Tf 0 -1 1 0 ' + f2(bx + bw / 2 - sz * 0.35) + ' ' + f2(by + bh / 2 + w / 2) + ' Tm (' + msg + ') Tj ET\n';
    } else {
      for (let i = 0; i < slots.length; i++) {
        const slot = slots[i]; if (!slot) continue;
        const p = slotPos(i);
        if (slot.type === 'text') {
          const fid = fontOf(slot.font);
          await ensureFont(fid);
          const pt = sizeOf({ text: slot.text, font: fid, size: slot.size });
          const lines = wrapText(slot.text, fid, pt);
          const nx = p.x * 72, ny = PH - (p.y + NOTE) * 72, pad = TEXT_PAD_IN * 72, lead = pt * TEXT_LEAD;
          const al = alignOf(slot), va = valignOf(slot);
          const rot = pdfRot((p.x + NOTE / 2) * 72, PH - (p.y + NOTE / 2) * 72, rotDeg(slot));
          if (fid === 'times') {                                   // standard PDF font: real, selectable text
            c += 'q ' + f2(nx) + ' ' + f2(ny) + ' ' + f2(NOTE * 72) + ' ' + f2(NOTE * 72) + ' re W n 0 g ' + rot + '\n';
            layoutLines(lines, fid, pt, al, va).forEach(l => {
              if (l.t) c += 'BT /F4 ' + pt + ' Tf 1 0 0 1 ' + f2(nx + l.x * 0.75) + ' ' + f2(PH - p.y * 72 - l.y * 0.75) + ' Tm (' + pdfText(l.t) + ') Tj ET\n';
            });
            c += 'Q\n';
          } else {                                                 // web font: draw the note as a 300 dpi image
            const N = Math.round(NOTE * 300), cv = document.createElement('canvas');
            cv.width = N; cv.height = N;
            const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, N, N);
            drawLines(cx, lines, fid, 300 / PX, 0, 0, pt, al, va);
            imgs.push({ bytes: dataUrlBytes(cv.toDataURL('image/jpeg', 0.95)), w: N, h: N, cs: 'DeviceRGB' });
            c += 'q ' + rot + f2(NOTE * 72) + ' 0 0 ' + f2(NOTE * 72) + ' ' + f2(nx) + ' ' + f2(ny) + ' cm /Im' + (imgs.length - 1) + ' Do Q\n';
          }
          debug.push('slot ' + (i + 1) + ': text, ' + FONT_BY_ID[fid].name + ', ' + pt + 'pt, ' + lines.length + ' lines');
          continue;
        }
        const fin = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
        const sc = Math.max(1, fin(slot.scale, 1)), ox = fin(slot.ox, 0), oy = fin(slot.oy, 0);
        let bytes = dataUrlBytes(slot.src), info = jpegInfo(bytes);
        if (!info || (info.n !== 1 && info.n !== 3)) {            // not a plain JPEG: re-encode through a canvas
          const im0 = await loadImg(slot.src), cv = document.createElement('canvas');
          cv.width = im0.naturalWidth; cv.height = im0.naturalHeight;
          const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im0, 0, 0);
          bytes = dataUrlBytes(cv.toDataURL('image/jpeg', 0.9)); info = jpegInfo(bytes);
        }
        if (!info) { debug.push('slot ' + (i + 1) + ': could not read photo data'); continue; }
        const S = NOTE - 2 * inset, ix = p.x + inset, iy = p.y + inset;
        const base = Math.max(S / info.w, S / info.h);
        const dw = info.w * base * sc, dh = info.h * base * sc;
        const left = ix + (S - dw) / 2 + ox * S, topY = iy + (S - dh) / 2 + oy * S;
        debug.push('slot ' + (i + 1) + ': ' + info.w + 'x' + info.h + ', ' + Math.round(bytes.length / 1024) + 'KB, zoom ' + sc.toFixed(2) + ', pan ' + ox.toFixed(2) + '/' + oy.toFixed(2));
        imgs.push({ bytes, w: info.w, h: info.h, cs: info.n === 1 ? 'DeviceGray' : 'DeviceRGB' });
        c += 'q ' + f2(ix * 72) + ' ' + f2(PH - (iy + S) * 72) + ' ' + f2(S * 72) + ' ' + f2(S * 72) + ' re W n ' + pdfRot((p.x + NOTE / 2) * 72, PH - (p.y + NOTE / 2) * 72, rotDeg(slot)) +
             f2(dw * 72) + ' 0 0 ' + f2(dh * 72) + ' ' + f2(left * 72) + ' ' + f2(PH - (topY + dh) * 72) + ' cm /Im' + (imgs.length - 1) + ' Do Q\n';
      }
    }
    const enc = new TextEncoder(), parts = [], offsets = []; let len = 0;
    const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
    const obj = (n, body) => { offsets[n] = len; push(n + ' 0 obj\n' + body + '\nendobj\n'); };
    const firstImg = 9, total = firstImg + imgs.length;
    push('%PDF-1.4\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    const xo = imgs.map((_, k) => '/Im' + k + ' ' + (firstImg + k) + ' 0 R').join(' ');
    obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R /F4 8 0 R >> /XObject << ' + xo + ' >> >> >>');
    const cb = new Uint8Array(c.length); for (let q = 0; q < c.length; q++) cb[q] = c.charCodeAt(q) & 255;
    offsets[4] = len; push('4 0 obj\n<< /Length ' + cb.length + ' >>\nstream\n'); push(cb); push('endstream\nendobj\n');
    obj(5, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
    obj(6, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique >>');
    obj(7, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
    obj(8, '<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>');
    imgs.forEach((im, k) => {
      offsets[firstImg + k] = len;
      push((firstImg + k) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h +
           ' /ColorSpace /' + im.cs + ' /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.bytes.length + ' >>\nstream\n');
      push(im.bytes); push('\nendstream\nendobj\n');
    });
    const xref = len;
    let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
    for (let n = 1; n < total; n++) x += String(offsets[n]).padStart(10, '0') + ' 00000 n \n';
    push(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
    lastDebug = debug.join('\n');
    return new Blob(parts, { type: 'application/pdf' });
  }

  let pdfUrl = null, pdfFile = null;
  async function makePdf(mode) {
    toast('Preparing PDF…');
    try {
      $('dlgPreview').src = (await renderCanvas(mode, 100)).toDataURL('image/png');
      const blob = await buildPdf(mode);
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfUrl = URL.createObjectURL(blob);
      const name = mode === 'template' ? 'stickyprint-template.pdf' : 'stickyprint-sheet.pdf';
      pdfFile = new File([blob], name, { type: 'application/pdf' });
      $('dlgOpen').href = pdfUrl; $('dlgDebug').textContent = lastDebug;
      $('dlgShare').style.display = (navigator.canShare && navigator.canShare({ files: [pdfFile] })) ? '' : 'none';
      toastEl.style.display = 'none';
      $('dlgBack').classList.add('open');
    } catch (e) { toast('Could not create the PDF. Try again, or use a desktop browser to print.'); }
  }
  $('dlgClose').onclick = () => $('dlgBack').classList.remove('open');
  $('dlgShare').onclick = () => { navigator.share({ files: [pdfFile], title: pdfFile.name }).catch(() => {}); };

  $('btnTemplate').onclick = $('mBtnTemplate').onclick = () => printMode('template');
  $('btnPrint').onclick = $('rvPrint').onclick = () => printMode('sheet');

  // Mobile review
  $('mBtnReview').onclick = () => { document.body.classList.add('reviewing'); fitSheet(); renderAll(); };
  $('rvBack').onclick = () => document.body.classList.remove('reviewing');

  // ---------- Init ----------
  load(); buildSheet(); renderPanel();
  window.addEventListener('resize', () => { fitSheet(); renderAll(); });
  fitSheet(); renderAll();
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || selected === null) return;
    if (panelView === 'font') { panelView = 'main'; renderPanel(); } else closeEditor();
  });
  onFontLoaded = () => { fitCache = new Map(); renderAll(); if (textPanelRefresh) textPanelRefresh(); };
})();
</script>
</body>
</html>
