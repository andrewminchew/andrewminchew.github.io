<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">

  <title>Grocery Inventory Checklist</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
    }

    .actions {
      position: sticky;
      top: 0;
      background: white;
      padding: 10px 0;
      border-bottom: 2px solid #eee;
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #f8f8f8;
    }

    button.primary {
      background-color: #007aff;
      color: white;
      border: none;
    }

    button:active {
      opacity: 0.8;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 15px;
    }

    li {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
    }

    label {
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Grocery Inventory Checklist</h1>

  <div class="actions">
    <button class="primary" onclick="copyToClipboard()">Copy Selected</button>
    <button onclick="uncheckAll()">Clear All</button>
  </div>

  <ul id="itemList"></ul>
  <script>
    // Your exact item list in order
    const items = [
      "bananas",
      "apples",
      "chia seeds",
      "almonds",
      "immodium",
      "probiotics",
      "vitamins",
      "doedorant",
      "body wash",
      "shampoo",
      "moisturizer",
      "wet cat food",
      "dry cat food",
      "kitty litter",
      "dog food",
      "dog treats",
      "bottle water",
      "laundry detergent",
      "dish soap",
      "dishwasher pods",
      "hand soap",
      "spray cleaner",
      "toilet paper",
      "paper towels",
      "orange juice",
      "creamer",
      "vanilla almond milk",
      "whole milk",
      "half and half",
      "heavy cream",
      "eggs",
      "fizzy water",
      "sleepy tea",
      "black tea earl gray",
      "decaf earl gray tea",
      "green tea",
      "coffee",
      "decaf coffee",
      "ritz",
      "goldfish",
      "granola",
      "pudding packs",
      "gummy snacks",
      "circus cookies",
      "veggie sauce",
      "apple sauce",
      "parmesan cheese",
      "pizzas"
    ];

    const listElement = document.getElementById("itemList");

    // Build the checkbox list dynamically
    items.forEach((item) => {
      const li = document.createElement("li");
      li.innerHTML = `
      <label>
        <input type="checkbox" value="${item}">
        ${item}
      </label>
    `;
      listElement.appendChild(li);
    });

    // Copy checked items as HTML list elements for Apple Reminders
    async function copyToClipboard() {
      const checkedBoxes = document.querySelectorAll('#itemList input[type="checkbox"]:checked');

      if (checkedBoxes.length === 0) {
        alert("No items selected!");
        return;
      }

      const selectedArray = Array.from(checkedBoxes).map(cb => cb.value);

      // Plain text fallback (standard line breaks)
      const plainText = selectedArray.join("\n");

      // HTML format (Apple Reminders parses <li> tags as separate reminder items)
      const htmlText = `<ul>${selectedArray.map(item => `<li>${item}</li>`).join("")}</ul>`;

      try {
        const textBlob = new Blob([plainText], { type: "text/plain" });
        const htmlBlob = new Blob([htmlText], { type: "text/html" });

        // Write both plain text and HTML to clipboard
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/plain": textBlob,
            "text/html": htmlBlob
          })
        ]);

        alert("Copied " + checkedBoxes.length + " item(s) to clipboard!");
      } catch (err) {
        // Fallback for older browsers
        navigator.clipboard.writeText(plainText).then(() => {
          alert("Copied as plain text (HTML clipboard API not supported).");
        });
      }
    }

    // Quick helper to reset all checkboxes
    function uncheckAll() {
      const checkboxes = document.querySelectorAll('#itemList input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);
    }
  </script>
</body>

</html>
